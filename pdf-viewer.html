<!doctype html>
<html>
<head>

<meta charset="utf-8" />

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
/>

<title>PDF Viewer</title>

<style>

:root {
  --bg: #0d1117;
  --accent: #58a6ff;
  --muted: #8b949e;
}

* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--bg);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    sans-serif;
}

.pdf-viewer-scroll {

  height: 100%;

  overflow: auto;

  padding: 20px;

  scroll-behavior: smooth;

  -webkit-overflow-scrolling: touch;
}

.pdf-pages {

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 20px;
}

.pdf-page {

  background: #fff;

  border-radius: 10px;

  overflow: hidden;

  box-shadow:
    0 18px 44px rgba(0,0,0,0.3);

  border:
    1px solid rgba(88,166,255,0.12);

  transform-origin: top center;

  will-change: transform;

  contain: content;
}

.pdf-page-label {

  font-size: 12px;

  font-weight: 600;

  letter-spacing: 0.5px;

  text-transform: uppercase;

  color: var(--muted);

  padding: 10px 14px;

  background: #fff;
}

.pdf-page canvas {

  display: block;

  width: 100%;

  height: auto;
}

.pdf-hint {

  color: var(--muted);

  font-size: 13px;

  text-align: center;

  margin-bottom: 18px;
}

.loading {

  width: 100%;

  height: 300px;

  display: flex;

  align-items: center;

  justify-content: center;

  color: var(--muted);

  font-size: 14px;
}

.zoom-indicator {

  position: fixed;

  right: 20px;

  bottom: 20px;

  background:
    rgba(13,17,23,0.92);

  border:
    1px solid rgba(88,166,255,0.2);

  color: #79c0ff;

  padding: 10px 14px;

  border-radius: 10px;

  font-size: 13px;

  z-index: 1000;

  backdrop-filter: blur(8px);

  pointer-events: none;
}

</style>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

</head>

<body>

<div
  id="pdfViewerScroll"
  class="pdf-viewer-scroll"
>

  <div class="pdf-hint">

    Scroll to navigate •
    Ctrl + Wheel or pinch to zoom

  </div>

  <div
    id="pdfPages"
    class="pdf-pages"
  ></div>

</div>

<div
  id="zoomIndicator"
  class="zoom-indicator"
>
  100%
</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const params =
  new URLSearchParams(location.search);

const fileUrl =
  params.get('file');

if (!fileUrl) {

  document.body.innerHTML =
    '<p style="padding:20px;color:#ff6b6b;">No PDF specified.</p>';

  throw new Error('No PDF specified');
}

const scrollContainer =
  document.getElementById('pdfViewerScroll');

const pagesContainer =
  document.getElementById('pdfPages');

const zoomIndicator =
  document.getElementById('zoomIndicator');

let pdfDoc = null;

let currentZoom = 1;

let baseScale = 1;

const renderedPages =
  new Map();

const renderTasks =
  new Map();

let zoomRAF = null;

let rerenderTimeout = null;

const MIN_ZOOM = 0.6;

const MAX_ZOOM = 3;

function clampZoom(v) {

  return Math.min(
    MAX_ZOOM,
    Math.max(MIN_ZOOM, v)
  );
}

function updateZoomIndicator() {

  zoomIndicator.textContent =
    Math.round(currentZoom * 100) + '%';
}

async function loadPDF() {

  try {

    pdfDoc =
      await pdfjsLib.getDocument({
        url: fileUrl,
        disableAutoFetch: false,
        disableStream: false,
        disableRange: false
      }).promise;

    const firstPage =
      await pdfDoc.getPage(1);

    const viewport =
      firstPage.getViewport({
        scale: 1
      });

    const availableWidth =
      Math.min(
        window.innerWidth - 70,
        1100
      );

    baseScale =
      availableWidth / viewport.width;

    createPageShells();

    setupObserver();

  } catch(err) {

    console.error(err);

    document.body.innerHTML =
      `<p style="padding:20px;color:#ff6b6b;">
        Failed to load PDF:
        ${err.message}
      </p>`;
  }
}

function createPageShells() {

  pagesContainer.innerHTML = '';

  for (
    let i = 1;
    i <= pdfDoc.numPages;
    i++
  ) {

    const wrapper =
      document.createElement('div');

    wrapper.className =
      'pdf-page';

    wrapper.dataset.page = i;

    const label =
      document.createElement('div');

    label.className =
      'pdf-page-label';

    label.textContent =
      'Page ' + i;

    const canvas =
      document.createElement('canvas');

    const loading =
      document.createElement('div');

    loading.className =
      'loading';

    loading.textContent =
      'Loading...';

    wrapper.appendChild(label);

    wrapper.appendChild(canvas);

    pagesContainer.appendChild(wrapper);
  }
}

async function renderPage(
  pageNumber,
  force = false
) {

  // BLOCK DUPLICATE CALLS IMMEDIATELY
  if (
    renderTasks.get(pageNumber) === 'pending'
    && !force
  ) {
    return;
  }

  if (
    renderedPages.has(pageNumber)
    && !force
  ) {
    return;
  }

  // MARK AS PENDING IMMEDIATELY
  renderTasks.set(pageNumber, 'pending');

  const wrapper =
    document.querySelector(
      `.pdf-page[data-page="${pageNumber}"]`
    );

  if (!wrapper) {

    renderTasks.delete(pageNumber);

    return;
  }

  const canvas =
    wrapper.querySelector('canvas');

  try {

    const page =
      await pdfDoc.getPage(pageNumber);

    const viewport =
      page.getViewport({
        scale:
          baseScale * currentZoom
      });

    const ratio =
      window.devicePixelRatio || 1;

    const context =
      canvas.getContext(
        '2d',
        {
          alpha: false
        }
      );

    canvas.width =
      Math.floor(
        viewport.width * ratio
      );

    canvas.height =
      Math.floor(
        viewport.height * ratio
      );

    canvas.style.width =
      viewport.width + 'px';

    canvas.style.height =
      viewport.height + 'px';

    wrapper.style.width =
      viewport.width + 'px';

    context.setTransform(
      ratio,
      0,
      0,
      ratio,
      0,
      0
    );

    context.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    const renderTask =
      page.render({
        canvasContext: context,
        viewport
      });

    // STORE REAL TASK
    renderTasks.set(
      pageNumber,
      renderTask
    );

    await renderTask.promise;

    renderedPages.set(
      pageNumber,
      true
    );

  } catch(err) {

    if (
      err?.name !==
      'RenderingCancelledException'
    ) {
      console.error(err);
    }

  } finally {

    renderTasks.delete(pageNumber);

  }
}


function setupObserver() {

  const observer =
    new IntersectionObserver(

      entries => {

        entries.forEach(entry => {

          if (entry.isIntersecting) {

            const pageNumber =
              Number(
                entry.target.dataset.page
              );

            renderPage(pageNumber);
          }
        });

      },

      {
        rootMargin: '1200px'
      }
    );

  document
    .querySelectorAll('.pdf-page')
    .forEach(page => {
      observer.observe(page);
    });
}

function getVisiblePages() {

  const pages = [];

  document
    .querySelectorAll('.pdf-page')
    .forEach(page => {

      const rect =
        page.getBoundingClientRect();

      if (
        rect.bottom > -1000 &&
        rect.top <
        window.innerHeight + 1000
      ) {

        pages.push(
          Number(page.dataset.page)
        );
      }
    });

  return pages;
}

function applyFastZoom(nextZoom) {

  cancelAnimationFrame(zoomRAF);

  zoomRAF =
    requestAnimationFrame(() => {

      document
        .querySelectorAll('.pdf-page')
        .forEach(page => {

          page.style.transform =
            `scale(${nextZoom / currentZoom})`;

        });

    });
}

function finalizeZoom(nextZoom) {

  const scrollRatio =
    scrollContainer.scrollTop /
    (
      scrollContainer.scrollHeight -
      scrollContainer.clientHeight
    );

  currentZoom = nextZoom;

  updateZoomIndicator();

  document
    .querySelectorAll('.pdf-page')
    .forEach(page => {

      page.style.transform =
        'scale(1)';
    });

  renderedPages.clear();

  clearTimeout(rerenderTimeout);

  rerenderTimeout =
    setTimeout(async () => {

      const visiblePages =
        getVisiblePages();

      for (
        const pageNum
        of visiblePages
      ) {

        await renderPage(
          pageNum,
          true
        );
      }

      requestAnimationFrame(() => {

        const newHeight =
          scrollContainer.scrollHeight -
          scrollContainer.clientHeight;

        scrollContainer.scrollTop =
          scrollRatio * newHeight;

      });

    }, 140);
}

function setZoom(nextZoom) {

  nextZoom =
    clampZoom(nextZoom);

  if (
    Math.abs(
      nextZoom - currentZoom
    ) < 0.01
  ) {
    return;
  }

  applyFastZoom(nextZoom);

  clearTimeout(rerenderTimeout);

  rerenderTimeout =
    setTimeout(() => {

      finalizeZoom(nextZoom);

    }, 120);
}

document.addEventListener(
  'wheel',

  e => {

    if (
      e.ctrlKey ||
      e.metaKey
    ) {

      e.preventDefault();

      const delta =
        e.deltaY > 0
          ? -0.12
          : 0.12;

      setZoom(
        currentZoom + delta
      );
    }

  },

  { passive: false }
);

let pinchStartDistance = 0;

let pinchStartZoom = 1;

document.addEventListener(
  'touchstart',

  e => {

    if (e.touches.length === 2) {

      pinchStartDistance =
        Math.hypot(
          e.touches[0].clientX -
          e.touches[1].clientX,

          e.touches[0].clientY -
          e.touches[1].clientY
        );

      pinchStartZoom =
        currentZoom;
    }

  },

  { passive: true }
);

document.addEventListener(
  'touchmove',

  e => {

    if (e.touches.length === 2) {

      e.preventDefault();

      const distance =
        Math.hypot(
          e.touches[0].clientX -
          e.touches[1].clientX,

          e.touches[0].clientY -
          e.touches[1].clientY
        );

      const scale =
        pinchStartZoom *
        (
          distance /
          pinchStartDistance
        );

      setZoom(scale);
    }

  },

  { passive: false }
);

window.addEventListener(
  'resize',

  () => {

    renderedPages.clear();

    getVisiblePages()
      .forEach(page =>
        renderPage(page, true)
      );

  },

  { passive: true }
);

scrollContainer.addEventListener(
  'scroll',

  () => {

    const visiblePages =
      getVisiblePages();

    visiblePages.forEach(page =>
      renderPage(page)
    );

  },

  { passive: true }
);

updateZoomIndicator();

loadPDF();

</script>

</body>
</html>
