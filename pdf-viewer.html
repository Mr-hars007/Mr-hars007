<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Viewer</title>
</head>
<body>
<script>
const params = new URLSearchParams(location.search);
const fileUrl = params.get('file');

if (!fileUrl) {
  document.body.innerHTML = '<p style="padding:20px;color:#ff6b6b;">No PDF specified.</p>';
} else {
  const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
    || (navigator.maxTouchPoints > 1);

  if (isMobile) {
    document.body.style.cssText = 'margin:0;background:#0d1117;';

    const hint = document.createElement('p');
    hint.textContent = 'Pinch to zoom';
    hint.style.cssText = 'color:#8b949e;font-size:12px;text-align:center;padding:12px;font-family:sans-serif;';
    document.body.appendChild(hint);

    const scroll = document.createElement('div');
    scroll.style.cssText = 'padding:0 16px 16px;display:flex;flex-direction:column;align-items:center;gap:16px;';
    document.body.appendChild(scroll);

    const pdfScript = document.createElement('script');
    pdfScript.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    pdfScript.onload = () => {
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

      pdfjsLib.getDocument(fileUrl).promise.then(async pdf => {
        const width = Math.min(window.innerWidth - 32, 800);
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const vp = page.getViewport({ scale: 1 });
          const scale = width / vp.width;
          const viewport = page.getViewport({ scale });
          const ratio = window.devicePixelRatio || 1;
          const canvas = document.createElement('canvas');
          canvas.width = Math.floor(viewport.width * ratio);
          canvas.height = Math.floor(viewport.height * ratio);
          canvas.style.cssText = `width:${viewport.width}px;height:${viewport.height}px;display:block;border-radius:6px;background:#fff;`;
          const ctx = canvas.getContext('2d');
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          scroll.appendChild(canvas);
          await page.render({ canvasContext: ctx, viewport }).promise;
        }
      }).catch(err => {
        scroll.innerHTML = `<p style="color:#ff6b6b;font-family:sans-serif;">Failed to load PDF: ${err.message}</p>`;
      });
    };
    document.head.appendChild(pdfScript);

  } else {
    window.location.replace(fileUrl);
  }
}
</script>
</body>
</html>
